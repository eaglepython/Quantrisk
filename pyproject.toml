[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantrisk"
version = "1.0.0"
description = "Fixed-income, market-risk and credit-risk analytics platform with a scheduled daily risk run."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Joseph Bidias" }]
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.48", "plotly>=5.20"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "types-PyYAML", "types-python-dateutil"]

[project.scripts]
quantrisk = "quantrisk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quantrisk = ["reporting/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# matplotlib's stubs are stricter than its runtime API; plotting glue is covered by tests instead
module = "quantrisk.reporting.charts"
disable_error_code = ["arg-type", "union-attr"]
