name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: quantrisk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      QR_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/quantrisk_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,dashboard]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src
      - name: Tests (PostgreSQL)
        run: pytest --cov=quantrisk --cov-report=term-missing --cov-fail-under=80
      - name: Schema migration applies cleanly
        run: |
          python -m quantrisk.cli init-db --ddl > /tmp/ddl.sql
          diff -u sql/migrations/001_init.sql /tmp/ddl.sql
      - name: Upload sample risk report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sample-risk-report
          path: /tmp/pytest-of-*/**/reports/**/*.html
          if-no-files-found: ignore

  build:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write      # OIDC to AWS, no long-lived keys
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t quantrisk:${{ github.sha }} .
      - name: Smoke test image
        run: docker run --rm quantrisk:${{ github.sha }} --help
      - name: Push to ECR
        if: vars.AWS_ROLE_ARN != ''
        env:
          ECR_REPO: ${{ vars.ECR_REPOSITORY_URL }}
        run: |
          echo "Configure aws-actions/configure-aws-credentials with ${{ vars.AWS_ROLE_ARN }} then:"
          echo "docker tag quantrisk:${{ github.sha }} $ECR_REPO:${{ github.sha }} && docker push $ECR_REPO:${{ github.sha }}"
